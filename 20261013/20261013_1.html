    <style>
      html,
      body,
      #app {
        height: 100%;
        margin: 0px;
        padding: 0px;
      }

      .chromeframe {
        margin: 0.2em 0;
        background: #ccc;
        color: #000;
        padding: 0.2em 0;
      }

      /* 添加关键帧动画定义 */
      @keyframes gradientBG {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      @keyframes flowDown {
        0% {
          transform: translateY(-100%);
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        90% {
          opacity: 1;
        }
        100% {
          transform: translateY(1000%);
          opacity: 0;
        }
      }

      @keyframes pulse {
        0% {
          transform: scale(0.8);
          opacity: 0.3;
        }
        50% {
          transform: scale(1.2);
          opacity: 0.7;
        }
        100% {
          transform: scale(0.8);
          opacity: 0.3;
        }
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      /* 主加载器包装器样式 */
      #loader-wrapper {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 999999;
        /* 基础背景色 */
        background-color: #0a0a14;
        /* 动态渐变背景 */
        background-image: linear-gradient(125deg, #0a0a14, #1a1a2e, #16213e, #0a0a14);
        background-size: 400% 400%;
        animation: gradientBG 15s ease infinite;
        overflow: hidden;
      }

      /* 在加载器包装器中添加流光线条 - 使用伪元素 */
      #loader-wrapper::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: linear-gradient(90deg, transparent, transparent, #00c6ff, transparent, transparent),
          linear-gradient(90deg, transparent, transparent, #0072ff, transparent, transparent),
          linear-gradient(90deg, transparent, transparent, #00c6ff, transparent, transparent);
        background-size: 200% 100%, 180% 100%, 160% 100%;
        background-position: 100% 0%, 0% 0%, 100% 0%;
        animation: flowDown 8s linear infinite, flowDown 10s linear 2s infinite, flowDown 7s linear 4s infinite;
        opacity: 0.3;
        z-index: 1;
      }

      /* 网格线效果 */
      #loader-wrapper::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: linear-gradient(rgba(0, 198, 255, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 198, 255, 0.05) 1px, transparent 1px);
        background-size: 20px 20px;
        z-index: 2;
      }

      /* 加载器样式 */
      #loader {
        display: block;
        position: relative;
        left: 50%;
        top: 50%;
        width: 150px;
        height: 150px;
        margin: -75px 0 0 -75px;
        border: 3px solid transparent;
        border-radius: 50%;
        border-top-color: #00c6ff;
        border-bottom-color: #0072ff;
        animation: spin 2s linear infinite;
        z-index: 1002;
        /* 添加发光效果 */
        box-shadow: 0 0 20px rgba(0, 198, 255, 0.5);
        margin-top: -90px; /* 向上偏移，为文字腾出空间 */
      }

      #loader:before {
        content: '';
        position: absolute;
        top: 5px;
        left: 5px;
        right: 5px;
        bottom: 5px;
        border: 3px solid transparent;
        border-radius: 50%;
        border-left-color: #00c6ff;
        border-right-color: #0072ff;
        animation: spin 3s linear infinite;
      }

      #loader:after {
        content: '';
        position: absolute;
        top: 15px;
        left: 15px;
        right: 15px;
        bottom: 15px;
        border: 3px solid transparent;
        border-radius: 50%;
        border-top-color: #00c6ff;
        border-bottom-color: #0072ff;
        animation: spin 1.5s linear infinite;
      }

      /* 添加光晕效果 - 使用加载器的额外伪元素 */
      #loader::before,
      #loader::after {
        content: '';
        position: absolute;
        top: -50px;
        left: -50px;
        right: -50px;
        bottom: -50px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(0, 198, 255, 0.1) 0%, rgba(10, 10, 20, 0) 70%);
        animation: pulse 4s ease-in-out infinite;
        z-index: -1;
      }

      /* 加载器部分样式 */
      #loader-wrapper .loader-section {
        position: fixed;
        top: 0;
        width: 51%;
        height: 100%;
        background: #0a0a14;
        z-index: 1000;
        transform: translateX(0);
      }

      #loader-wrapper .loader-section.section-left {
        left: 0;
      }

      #loader-wrapper .loader-section.section-right {
        right: 0;
      }

      /* 加载完成后的过渡效果 */
      .loaded #loader-wrapper .loader-section.section-left {
        transform: translateX(-100%);
        transition: all 0.7s 0.3s cubic-bezier(0.645, 0.045, 0.355, 1);
      }

      .loaded #loader-wrapper .loader-section.section-right {
        transform: translateX(100%);
        transition: all 0.7s 0.3s cubic-bezier(0.645, 0.045, 0.355, 1);
      }

      .loaded #loader {
        opacity: 0;
        transition: all 0.3s ease-out;
      }

      .loaded #loader-wrapper {
        visibility: hidden;
        transform: translateY(-100%);
        transition: all 0.3s 1s ease-out;
      }

      .no-js #loader-wrapper {
        display: none;
      }

      .no-js h1 {
        color: #222222;
      }

      #loader-wrapper .load_title {
        font-family: 'Open Sans';
        color: #fff;
        font-size: 19px;
        width: 100%;
        text-align: center;
        z-index: 9999999999999;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        line-height: 1;
        margin: 0;
        text-shadow: 0 0 10px rgba(0, 198, 255, 0.5);
      }

      #loader-wrapper .load_title span {
        font-weight: normal;
        font-style: italic;
        font-size: 13px;
        color: #fff;
        opacity: 0.5;
      }

      .tox-tinymce-aux {
        z-index: 9999 !important;
      }
