<html lang="zh-CN"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>报告查询系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background-color: #f3f4f6;
            padding: 15px;
        }
        .container {
            max-width: 430px; /* 匹配iPhone Pro Max宽度 */
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        .header-bar {
            background-color: #00b8d4;
            color: #fff;
            text-align: center;
            padding: 18px 12px;
        }
        .header-bar h1 {
            font-size: 22px; /* 缩小顶部标题字号 */
            line-height: 1.4;
            font-weight: bold;
        }
        .info-table {
            width: 100%;
            border-collapse: collapse;
        }
        .info-table tr {
            border-bottom: 1px solid #e8e8e8;
        }
        .info-table td {
            padding: 12px 14px; /* 减小单元格上下内边距 */
            font-size: 15px; /* 缩小表格内容字体 */
            line-height: 1.45;
        }
        .info-table td:first-child {
            width: 24%;
            background-color: #f2f2f2;
            font-weight: 500;
        }
        .qrcode-box img {
            width: 130px;
            height: 130px;
        }
        .tip-area {
            padding: 14px;
        }
        .tip-text {
            color: #e53935;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <!--顶部蓝条标题-->
        <div class="header-bar">

        </div>
