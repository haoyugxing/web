<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>寻味顺德 · 18站足球闯关任务卡</title>
<style>
  :root{
    --cream:#FBF6EE; --paper:#FFFFFF; --ink:#2A211A; --muted:#7A6A5C;
    --red:#C1443A; --red-dark:#B93A2B; --gold:#D89B4A; --green:#3E7D5A; --line:#EADFD0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink); min-height:100vh;
    background:
      radial-gradient(1200px 600px at 8% -10%, #FDEBD8 0%, transparent 60%),
      radial-gradient(1000px 520px at 100% 0%, #E8F3EC 0%, transparent 55%),
      var(--cream);
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:980px;margin:0 auto;padding:22px 16px 110px;}

  /* ---------- 顶栏 ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .logo{
    width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;
    background:linear-gradient(135deg,#C1443A,#E07A3F);
    box-shadow:0 8px 18px -6px rgba(193,68,58,.55);
  }
  .brand h1{margin:0;font-size:19px;letter-spacing:.08em;}
  .brand p{margin:3px 0 0;font-size:11.5px;color:var(--muted);letter-spacing:.14em;}
  .progress-wrap{text-align:right;min-width:120px;}
  .progress-text{font-size:11.5px;color:var(--muted);letter-spacing:.1em;}
  .progress-text span{font-size:19px;font-weight:800;color:var(--red);font-variant-numeric:tabular-nums;}
  .progress-bar{height:6px;width:132px;background:#EFE4D6;border-radius:99px;overflow:hidden;margin-top:6px;margin-left:auto;}
  .progress-bar i{display:block;height:100%;width:5.5%;border-radius:99px;background:linear-gradient(90deg,#C1443A,#D89B4A);transition:width .35s ease;}

  /* ---------- 站点导航 ---------- */
  .chips{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 14px;scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;white-space:nowrap;font-family:inherit;font-size:12.5px;font-weight:600;
    padding:7px 14px;border-radius:99px;border:1px solid var(--line);
    background:#fff;color:var(--muted);cursor:pointer;transition:.2s;
  }
  .chip:hover{border-color:#D9C4A9;color:var(--ink);}
  .chip.active{
    background:linear-gradient(135deg,#C1443A,#B93A2B);color:#fff;border-color:transparent;
    box-shadow:0 8px 16px -8px rgba(193,68,58,.9);
  }

  /* ---------- 卡片 ---------- */
  .card{
    background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:hidden;
    box-shadow:0 24px 50px -28px rgba(90,60,30,.55);animation:fadeUp .38s ease;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

  .card-head{
    position:relative;overflow:hidden;padding:22px 24px;color:#fff;
    background:linear-gradient(120deg,#8E2F27 0%,#C1443A 48%,#D0703C 100%);
  }
  .card-head::after{
    content:"";position:absolute;right:-50px;top:-70px;width:190px;height:190px;
    border-radius:50%;background:rgba(255,255,255,.09);
  }
  .card-head::before{
    content:"⚽";position:absolute;right:22px;bottom:-20px;font-size:84px;opacity:.13;line-height:1;
  }
  .head-row{position:relative;z-index:1;display:flex;align-items:center;gap:16px;}
  .st-num{
    font-size:38px;font-weight:800;line-height:1;letter-spacing:-.03em;
    font-variant-numeric:tabular-nums;opacity:.92;text-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  .card-head h2{margin:0;font-size:21px;letter-spacing:.04em;}
  .food-tag{
    display:inline-block;margin-top:7px;font-size:12px;padding:3px 11px;border-radius:99px;
    background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.38);
  }

  .body{padding:22px 24px 26px;}

  /* 寻味链接 */
  .link-quote{
    margin:0 0 24px;padding:16px 18px;border-radius:0 14px 14px 0;
    background:#FFF8EF;border-left:4px solid var(--gold);
  }
  .quote-label{font-size:11px;font-weight:800;letter-spacing:.2em;color:var(--gold);}
  .link-quote p{margin:8px 0 0;font-size:14.5px;line-height:1.9;color:#4A3B2E;}

  /* 小标题 */
  .sec-title{
    display:flex;align-items:center;gap:8px;margin:0 0 13px;
    font-size:13.5px;letter-spacing:.16em;color:var(--red);font-weight:800;
  }
  .sec-title::before{
    content:"";width:5px;height:16px;border-radius:3px;
    background:linear-gradient(#C1443A,#D89B4A);
  }

  /* 任务格 */
  .tasks{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px;}
  .task{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:#FDFBF7;}
  .t-label{
    display:inline-block;margin-bottom:8px;padding:3px 11px;border-radius:99px;
    font-size:11.5px;font-weight:800;letter-spacing:.06em;
  }
  .t-warm{background:#FDF0DC;color:#B57A22;}
  .t-basic{background:#FDECEA;color:#B93A2B;}
  .t-adv{background:#E9F2EC;color:#2F6B4C;}
  .t-relax{background:#EDEBF6;color:#5C5192;}
  .task p{margin:0;font-size:13.5px;line-height:1.8;color:#4A3B2E;}

  /* 数学眼睛 */
  .math-box{
    margin-bottom:20px;padding:16px 18px;border-radius:14px;
    background:linear-gradient(135deg,#F1F7F3,#EAF3EE);border:1px solid #D5E6DC;
  }
  .math-box h3{margin:0 0 8px;font-size:14px;color:#2F6B4C;letter-spacing:.1em;}
  .math-box p{margin:0;font-size:13.5px;line-height:1.85;color:#3D5147;}

  /* 示意图 */
  .diagram-box{
    margin:0 0 18px;border:1px solid var(--line);border-radius:16px;
    background:#FEFCF8;padding:14px 16px 10px;
  }
  .diagram-box.math{background:#F7FBF8;border-color:#D5E6DC;}
  .diagram-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .diagram-label{font-size:11.5px;font-weight:800;letter-spacing:.16em;color:var(--muted);}
  .diagram-box.math .diagram-label{color:var(--green);}
  .diagram-hint{font-size:11px;color:#C4B4A3;}
  .diagram-svg{width:100%;display:flex;justify-content:center;}
  .diagram-svg svg{width:100%;max-width:560px;height:auto;display:block;}

  /* 今日小问 */
  .ask-box{
    margin-bottom:22px;padding:16px 18px;border-radius:14px;
    background:#FFF9F3;border:1px dashed #E8D5BE;
  }
  .ask-box h3{margin:0 0 8px;font-size:14px;color:#B57A22;letter-spacing:.1em;}
  .ask-box .q{margin:0 0 12px;font-size:13.5px;line-height:1.8;color:#5B4A3A;}
  .ask-box label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px;letter-spacing:.06em;}
  textarea{
    width:100%;min-height:84px;resize:vertical;font-family:inherit;
    font-size:13.5px;line-height:1.75;color:var(--ink);
    padding:11px 13px;border:1px solid #E8D5BE;border-radius:10px;background:#fff;
    outline:none;transition:.2s;
  }
  textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(216,155,74,.16);}
  textarea::placeholder{color:#C4B4A3;}

  /* 评价表 */
  .rating{border-top:1px solid var(--line);padding-top:18px;}
  .rating-list{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:10px;}
  .rating-list label{
    display:flex;align-items:center;gap:9px;padding:9px 15px;border-radius:11px;
    border:1px solid var(--line);background:#fff;font-size:13px;cursor:pointer;transition:.18s;
  }
  .rating-list label:hover{border-color:#D9C4A9;}
  .rating-list input{
    appearance:none;-webkit-appearance:none;margin:0;width:18px;height:18px;flex:0 0 auto;
    border:1.5px solid #D6C3AB;border-radius:5px;position:relative;cursor:pointer;transition:.15s;background:#fff;
  }
  .rating-list input:checked{background:var(--green);border-color:var(--green);}
  .rating-list input:checked::after{
    content:"✓";position:absolute;inset:0;display:grid;place-items:center;
    color:#fff;font-size:12px;font-weight:800;
  }
  .rating-list label:has(input:checked){border-color:#BEDCCB;background:#F2F9F5;}

  /* 底部翻页 */
  .pager{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    display:flex;justify-content:center;gap:12px;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,rgba(251,246,238,.99),rgba(251,246,238,.86));
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-top:1px solid rgba(234,223,208,.9);
  }
  .pager button{
    font-family:inherit;font-size:14px;font-weight:700;
    padding:11px 28px;border-radius:99px;cursor:pointer;transition:.2s;
    border:1px solid var(--line);background:#fff;color:var(--ink);
  }
  .pager button:hover:not(:disabled){border-color:var(--red);color:var(--red);}
  .pager button.primary{
    border-color:transparent;color:#fff;
    background:linear-gradient(135deg,#C1443A,#B93A2B);
    box-shadow:0 10px 20px -8px rgba(193,68,58,.75);
  }
  .pager button.primary:hover:not(:disabled){color:#fff;filter:brightness(1.07);}
  .pager button:disabled{opacity:.38;cursor:not-allowed;}

  @media (max-width:640px){
    .app{padding:16px 12px 104px;}
    .tasks{grid-template-columns:1fr;}
    .body{padding:18px 16px 22px;}
    .card-head{padding:18px 18px;}
    .st-num{font-size:30px;}
    .card-head h2{font-size:18px;}
    .brand h1{font-size:16px;}
    .brand p{font-size:10.5px;}
    .progress-bar{width:96px;}
    .pager button{padding:11px 22px;font-size:13.5px;}
    .diagram-box{padding:10px 8px 6px;}
  }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">⚽</div>
      <div>
        <h1>寻味顺德</h1>
        <p>18 站足球闯关任务卡</p>
      </div>
    </div>
    <div class="progress-wrap">
      <div class="progress-text"><span id="curNum">1</span> / 18</div>
      <div class="progress-bar"><i id="bar"></i></div>
    </div>
  </header>

  <nav class="chips" id="chips"></nav>
  <main id="stage"></main>

  <footer class="pager">
    <button id="prev">← 上一站</button>
    <button id="next" class="primary">下一站 →</button>
  </footer>
</div>

<script>
/* ============ 数据 ============ */

    math:"画出实际运球路线，标出转折点，思考在什么位置进行变向最合适。",

  {

    math:"从中心点 O 出发画出射线，模拟圆桌向外的 8 个上菜方向，观察射线分割平面形成的区域并标注方位。",

    math:"在线段上标出每次触球的位置，观察各点之间的距离是否接近。",

/* ============ SVG 绘制辅助 ============ */
const SW = 440, SH = 176;
const CLR = {blue:'#3A6EA5', green:'#3E7D5A', orange:'#D89B4A', red:'#C1443A',
             gray:'#B9A99A', dark:'#5B4A3A', line:'#E0B77C', thin:'#D9C4A9'};

function dSvg(inner, h){
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${SW} ${h||SH}" fill="none" preserveAspectRatio="xMidYMid meet">${inner}</svg>`;
}
function dLine(x1,y1,x2,y2,c,w,dash){
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c||CLR.line}" stroke-width="${w||2.5}"${dash?` stroke-dasharray="${dash}"`:''} stroke-linecap="round"/>`;
}
function dDot(x,y,c,r){
  return `<circle cx="${x}" cy="${y}" r="${r||5}" fill="${c||CLR.blue}"/>`;
}
function dCircle(x,y,r,stroke,fill,sw){
  return `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill||'none'}" stroke="${stroke||'none'}" stroke-width="${sw===undefined?2.5:sw}"/>`;
}
function dTxt(x,y,s,size,c,anchor,weight){
  return `<text x="${x}" y="${y}" font-size="${size||10}" fill="${c||CLR.dark}" text-anchor="${anchor||'middle'}" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-weight="${weight||400}">${s}</text>`;
}
function dPanel(x,y,w,h,label,color){
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="#FDFBF7" stroke="#EADFD0"/>`
    + `<text x="${x+w/2}" y="${y+21}" font-size="11" fill="${color||CLR.green}" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="700">${label}</text>`;
}
function dTri(x,y,s,c){
  s = s||6;
  return `<path d="M${x},${y-s} L${x+s*0.9},${y+s*0.75} L${x-s*0.9},${y+s*0.75} Z" fill="${c||CLR.orange}"/>`;
}
function dRect(x,y,w,h,fill,stroke,rx){
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx===undefined?8:rx}" fill="${fill||'none'}" stroke="${stroke||'none'}"/>`;
}

function buildDrill(n){ return dSvg((DRILL[n]||(()=>''))(), SH); }
function buildMath(n){ return dSvg((MATH[n]||(()=>''))(), SH); }

/* ============ 逻辑 ============ */
const chipsEl  = document.getElementById('chips');
const stageEl  = document.getElementById('stage');
const curNumEl = document.getElementById('curNum');
const barEl    = document.getElementById('bar');
const prevBtn  = document.getElementById('prev');
const nextBtn  = document.getElementById('next');

const KEY = 'shunde-football-18';
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { store = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }

let current = 0;

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
}
function pad(n) { return String(n).padStart(2, '0'); }

function buildChips() {
  chipsEl.innerHTML = DATA.map((s, i) =>
    `<button class="chip${i === current ? ' active' : ''}" data-i="${i}">${pad(s.n)} ${esc(s.short)}</button>`
  ).join('');
}

function render() {
  const s = DATA[current];
  const saved = store[s.n] || { finding: '', checks: [] };

  stageEl.innerHTML = `
    <article class="card">
      <div class="card-head">
        <div class="head-row">
          <div class="st-num">${pad(s.n)}</div>
          <div>
            <h2>${esc(s.name)}</h2>
            <span class="food-tag">🥢 打卡美食：${esc(s.food)}</span>
          </div>
        </div>
      </div>

      <div class="body">
        <blockquote class="link-quote">
          <span class="quote-label">寻味链接</span>
          <p>${esc(s.link)}</p>
        </blockquote>

        <h3 class="sec-title">今日任务</h3>
        <div class="tasks">
          <div class="task"><span class="t-label t-warm">热身 · 3分钟</span><p>${esc(s.warm)}</p></div>
          <div class="task"><span class="t-label t-basic">基础组 · 必做</span><p>${esc(s.basic)}</p></div>
          <div class="task"><span class="t-label t-adv">挑战组 · 选做</span><p>${esc(s.advance)}</p></div>
          <div class="task"><span class="t-label t-relax">放松 · 3分钟</span><p>${esc(s.relax)}</p></div>
        </div>

        <div class="diagram-box">
          <div class="diagram-head">
            <span class="diagram-label">锻炼示意图</span>
            <span class="diagram-hint">基础组 / 挑战组</span>
          </div>
          <div class="diagram-svg">${buildDrill(s.n)}</div>
        </div>

        <div class="math-box">
          <h3>🔢 数学融合任务 · 3分钟</h3>
          <p>${esc(s.math)}</p>
        </div>

        <div class="diagram-box math">
          <div class="diagram-head">
            <span class="diagram-label">数学融合任务示意图</span>
            <span class="diagram-hint">点 · 线 · 面</span>
          </div>
          <div class="diagram-svg">${buildMath(s.n)}</div>
        </div>

        <div class="ask-box">
          <h3>💡 今日小问</h3>
          <p class="q">结合今天的数学任务，说说你发现了什么？</p>
          <label for="finding">我的发现：</label>
          <textarea id="finding" placeholder="写下你的发现……">${esc(saved.finding || '')}</textarea>
        </div>

        <div class="rating">
          <h3 class="sec-title">评价项目 · 星级表（自评 + 家长评）</h3>
          <ul class="rating-list">
            ${s.check.map((c, i) => `
              <li><label>
                <input type="checkbox" data-i="${i}" ${(saved.checks || []).includes(i) ? 'checked' : ''}>
                <span>${esc(c)}</span>
              </label></li>`).join('')}
          </ul>
        </div>
      </div>
    </article>
  `;

  const ta = document.getElementById('finding');
  ta.addEventListener('input', () => {
    const rec = store[s.n] || (store[s.n] = { finding: '', checks: [] });
    rec.finding = ta.value;
    save();
  });

  stageEl.querySelectorAll('.rating-list input').forEach(inp => {
    inp.addEventListener('change', () => {
      const rec = store[s.n] || (store[s.n] = { finding: '', checks: [] });
      const idx = Number(inp.dataset.i);
      rec.checks = rec.checks || [];
      if (inp.checked) { if (!rec.checks.includes(idx)) rec.checks.push(idx); }
      else { rec.checks = rec.checks.filter(x => x !== idx); }
      save();
    });
  });

  curNumEl.textContent = s.n;
  barEl.style.width = ((current + 1) / DATA.length * 100) + '%';
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === DATA.length - 1;
  nextBtn.textContent = current === DATA.length - 1 ? '已完成全部 ✦' : '下一站 →';

  chipsEl.querySelectorAll('.chip').forEach((c, i) => c.classList.toggle('active', i === current));
  const activeChip = chipsEl.querySelector('.chip.active');
  if (activeChip) activeChip.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });

  window.scrollTo({ top: 0, behavior: 'auto' });
}

chipsEl.addEventListener('click', e => {
  const btn = e.target.closest('.chip');
  if (!btn) return;
  current = Number(btn.dataset.i);
  render();
});

prevBtn.addEventListener('click', () => { if (current > 0) { current--; render(); } });
nextBtn.addEventListener('click', () => { if (current < DATA.length - 1) { current++; render(); } });

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowLeft') prevBtn.click();
  if (e.key === 'ArrowRight') nextBtn.click();
});

let tX = 0, tY = 0;
document.addEventListener('touchstart', e => {
  tX = e.touches[0].clientX; tY = e.touches[0].clientY;
}, { passive: true });
document.addEventListener('touchend', e => {
  if (e.target.closest('textarea')) return;
  const dx = e.changedTouches[0].clientX - tX;
  const dy = e.changedTouches[0].clientY - tY;
  if (Math.abs(dx) > 75 && Math.abs(dx) > Math.abs(dy) * 1.6) {
    dx < 0 ? nextBtn.click() : prevBtn.click();
  }
}, { passive: true });

buildChips();
render();
</script>
</body>
</html>
