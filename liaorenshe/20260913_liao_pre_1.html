<!DOCTYPE html>
<html lang="en">
<head>
	<title></title>
	<style>
		/* 设置body和html的高度为100%，这样它们就可以占据整个视口 */
		html, body {
		    /* height: 100%; */
		    margin: 0; /* 移除默认的margin */
		    padding: 0; /* 移除默认的padding */
		}
		/* 针对所有元素禁用点击高亮 */
		* {
			-webkit-tap-highlight-color: transparent; /* 或 rgba(0, 0, 0, 0) */
		  }
		 
		/* 设置图片容器的高度和宽度为100%，使其覆盖整个屏幕 */
		.fullscreen-image {
		    width: 100%; /* 宽度为100% */
		    height: 100%; /* 高度为100% */
		    overflow: hidden; /* 隐藏溢出的部分 */
		}
		 
		/* 设置img标签的宽度和高度也为100%，确保图片填满容器 */
		.fullscreen-image img {
		    width: 100%; /* 宽度为100% */
		    /* height: 100%; /* 高度为100% */ */
		    /* object-fit: cover; /* 保持图片的宽高比，并覆盖整个容器 */ */
		}
	 /* 小图样式 */
	        .thumbnail {
	            width: 200px;
	            cursor: pointer;
	        }
	        /* 模态框样式 */
	        #modal {
	            display: none;
	            position: fixed;
	            top: 0;
	            left: 0;
	            width: 100%;
	            height: 100%;
	            background: rgba(0,0,0,0.9);
	            z-index: 1000;
	            text-align: center;
	        }
	        #modal-img {
	            max-width: 80%;
	            max-height: 80%;
	            margin-top: 5%;
	        }
	        .close {
	            color: white;
	            font-size: 40px;
	            position: absolute;
	            top: 20px;
	            right: 30px;
	            cursor: pointer;
	        }
	</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Screen Image</title>
</head>
<body>
