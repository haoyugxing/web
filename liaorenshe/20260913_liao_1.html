		 <script>
        // 初始化验证码
        let currentCaptcha;
		document.getElementById('verificationValue').value="af29850be51c470181fb8a7ce6cc38a7"
        
        // 颜色生成函数
        function getRandomColor() {
            // 使用HSL色彩模式保证颜色鲜艳
            const hue = Math.floor(Math.random() * 360);
            return `hsl(${hue}, 70%, 50%)`;
        }

        // 改进后的验证码生成函数
        function generateCaptcha() {
            // 生成4位随机数字验证码
            currentCaptcha = Math.floor(1000 + Math.random() * 9000).toString();
            const container = document.getElementById('captchaDisplay');
            
            // 清空容器
            container.innerHTML = '';
            
            // 为每个数字创建带颜色的span
            for (const char of currentCaptcha) {
                const span = document.createElement('span');
                span.textContent = char;
                span.style.color = getRandomColor();  // 为每个数字设置随机颜色
                container.appendChild(span);
            }
        }


        // 首次加载生成验证码
        generateCaptcha();
		
		  function validateInput() {
            const authCode = document.getElementById('verificationValue').value;
            const userCaptcha = document.getElementById('captchaValue').value;
            // 固定授权码验证（示例授权码：123）
            if(authCode !== 'af29850be51c470181fb8a7ce6cc38a7') {
                alert('授权码错误！');
                return;
            }

            // 验证码验证
            if(userCaptcha !== currentCaptcha.toString()) {
                alert('验证码错误！');
                generateCaptcha(); // 刷新验证码
                return;
            }
