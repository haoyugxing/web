<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>无法打开</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: system-ui, -apple-system, sans-serif;
}
body{
  min-height:100vh;
  background:#f7f8fa;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}
.card{
  background:#ffffff;
  border-radius:18px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  text-align:center;
  padding:48px 36px;
  max-width:400px;
  width:100%;
}
.icon{
  font-size:56px;
  color:#9ca3af;
  margin-bottom:24px;
}
h1{
  font-size:22px;
  color:#1f2937;
  font-weight:600;
  margin-bottom:12px;
}
p{
  color:#6b7280;
  line-height:1.7;
  font-size:15px;
}
</style>
</head>
<body>
<div class="card">
  <div class="icon">📄</div>
  <h1>文件无法打开</h1>
  <p>该链接已失效，文件不存在或已被移除</p>
</div>
</body>
</html>
