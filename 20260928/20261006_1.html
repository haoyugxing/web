<body>
  <div class="header"><div class="badge">互动问答挑战</div></div>

  <div class="question-card">
    <div class="question-num">第 1 题 / 共 1 题</div>
    <div class="question-text">新人是怎么认识的？第一次见面是吃的什么？</div>
  </div>

  <div class="options" id="options">
    <div class="option" data-answer="A"><div class="label">A</div><div class="text">家人介绍-火锅</div></div>
    <div class="option" data-answer="B"><div class="label">B</div><div class="text">偶遇扫码-烧烤</div></div>
    <div class="option" data-answer="C"><div class="label">C</div><div class="text">同学认识-日料</div></div>
    <div class="option" data-answer="D"><div class="label">D</div><div class="text">从小就认识-中餐</div></div>
  </div>

  <div class="result" id="result-correct">
    <div class="icon">✓</div>
    <div class="title">回答正确！</div>
    <div>恭喜你通关，你的通关码是：</div>
    <div class="code">1234</div>
    <div class="hint">请将此数字出示给主持人</div>
  </div>

  <div class="result" id="result-wrong">
    <div class="icon">✗</div>
    <div class="title">回答错误</div>
    <div class="encourage">下题加油哦</div>
    <div class="hint">本题每人仅可作答一次</div>
  </div>

<script>
  var correctAnswer = 'B';
  var options = document.querySelectorAll('.option');
  var key = 'quiz_wedding_v1';

  function lockOptions(picked) {
    options.forEach(function(o) {
      var ans = o.getAttribute('data-answer');
      if (ans === picked) {
        if (picked === correctAnswer) o.classList.add('correct');
        else o.classList.add('wrong-picked');
      } else { o.classList.add('dimmed'); }
    });
  }
  function showResult(win) {
    if (win) document.getElementById('result-correct').classList.add('show');
    else document.getElementById('result-wrong').classList.add('show');
  }
  var prev = null;
  try { prev = localStorage.getItem(key); } catch(e) {}
  if (prev === 'correct' || prev === 'wrong') {
    lockOptions(prev === 'correct' ? 'B' : 'X');
    showResult(prev === 'correct');
  } else {
    options.forEach(function(opt) {
      opt.addEventListener('click', function() {
        var chosen = opt.getAttribute('data-answer');
        var win = (chosen === correctAnswer);
        try { localStorage.setItem(key, win ? 'correct' : 'wrong'); } catch(e) {}
        lockOptions(chosen);
        setTimeout(function() { showResult(win); }, 500);
      });
    });
  }
</script>
