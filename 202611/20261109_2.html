    .preview-mask {
      position: fixed;
      left: 0; top: 0; right: 0; bottom: 0;

      display: none;

    .preview-dialog {
      width: 92vw;
      max-width: 1000px;
      height: 88vh;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 30px rgba(0, 0, 0, .35);
      animation: previewIn .2s ease-out;
    }
    @keyframes previewIn {
      from { opacity: 0; transform: scale(.94); }
      to   { opacity: 1; transform: scale(1); }
    }

    .preview-header {
      flex: 0 0 auto;
      height: 44px;

    /* 内容区：长图纵向滚动 */

  <script>
  (function () {
    var link      = document.getElementById('pdfLink');
    var mask      = document.getElementById('previewMask');
    var body      = document.getElementById('previewBody');
    var titleEl   = document.getElementById('previewTitle');
    var closeBtn  = document.getElementById('previewClose');
    var downloadBtn = document.getElementById('previewDownload');

    // 按后缀判断是不是图片
    var IMAGE_EXT = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'svg', 'ico'];

    function getExt(url) {
      var clean = String(url).split('?')[0].split('#')[0];
      var i = clean.lastIndexOf('.');
      return i > -1 ? clean.slice(i + 1).toLowerCase() : '';
    }

    function clearBody() {
      body.innerHTML = '';
    }

    function showTip(html) {
      clearBody();
      var tip = document.createElement('div');
      tip.className = 'preview-tip';
      tip.innerHTML = html;
      body.appendChild(tip);
    }

    // 打开预览
    function openPreview(url, name) {
      clearBody();
      titleEl.textContent = name || url;
      downloadBtn.setAttribute('href', url);
      downloadBtn.setAttribute('download', name || '');

      var loading = document.createElement('div');
      loading.className = 'preview-loading';
      loading.textContent = '加载中...';
      body.appendChild(loading);

      var removeLoading = function () {
        if (loading && loading.parentNode) loading.parentNode.removeChild(loading);
      };

      var ext = getExt(url);

      if (IMAGE_EXT.indexOf(ext) > -1) {
        /* ---------- 图片（含长图） ---------- */
        var img = new Image();
        img.onload = removeLoading;
        img.onerror = function () {
          showTip('图片加载失败，请 <a href="' + url + '" download>点击下载</a>');
        };
        img.alt = name || '';
        img.src = url;
        body.appendChild(img);
      } else {
        /* ---------- PDF / 其它文件，用 iframe 内嵌预览（不跳转页面） ---------- */
        var iframe = document.createElement('iframe');
        iframe.onload = removeLoading;
        iframe.src = url;
        body.appendChild(iframe);

        // 兜底：部分移动端浏览器（如 Android Chrome）不支持内嵌 PDF，
        // 4 秒后仍停留在加载态就提示下载
        setTimeout(function () {
          if (loading && loading.parentNode) {
            showTip(
              '当前浏览器可能不支持在线预览该文件，<br/>请 <a href="' + url + '" download>点击下载</a> 后查看'
            );
          }
        }, 4000);
      }

      mask.classList.add('show');
      document.body.style.overflow = 'hidden'; // 锁定背景滚动
    }

    // 关闭预览
    function closePreview() {
      mask.classList.remove('show');
      clearBody();                                  // 清空 iframe，停止加载
      document.body.style.overflow = '';
    }

    // 点击文件名 → 打开预览
    link.addEventListener('click', function (e) {
      e.preventDefault();                           // 阻止默认跳转
      var url = link.getAttribute('data-src') || link.getAttribute('href') || '';
      if (!url || url === '#') {
        alert('未配置文件地址');
        return;
      }
      openPreview(url, link.textContent.trim());
    });

    // 关闭按钮
    closeBtn.addEventListener('click', closePreview);

    // 点击遮罩空白处关闭
    mask.addEventListener('click', function (e) {
      if (e.target === mask) closePreview();
    });

    // ESC 关闭
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && mask.classList.contains('show')) closePreview();
    });
  })();
  </script>
