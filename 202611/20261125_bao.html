    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "SimSun", "宋体", serif;
        }

        td {
            margin: 0;
            padding: 0;
        }
        
        body {
            color: #333;
        }
        
        .audit-report {
            width: 100vw;
            margin: 0 auto;

        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            height: 100px;
            line-height: 100px;
        }
        
        .company-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }
        
        .report-title {
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            margin: 30px 0;
            padding: 10px 0;
            border-top: 2px solid #333;
            border-bottom: 2px solid #333;
        }
        
        table {
            border-collapse: collapse; /* 防止边框合并 */
        }

         .info-table {
            width: 90%;
            margin:0 auto;
        }

        
        .info-table td {
            padding: 30px 10px;
            border: 1px solid #ddd;
        }
        
        .info-table .label {
            width: 30%;
            background-color: #e8eef2;
        }
        
    </style>
</head>
