			    cursor: pointer;
			    display: block;

			    font-family: PingFangSC-Regular;
			}
			.quick_build2 .dialog-sure:hover{
				background:#648BFF;	
				transition:.3s;
			}
			.error {
				font-weight: 400;
			}

			/* ===== 新增：全屏图片覆盖层 ===== */
			#fullscreenOverlay {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				//height: 100%;
				background-color: #000;
				z-index: 99999;
				display: none;       /* 默认隐藏 */
				align-items: center;
				justify-content: center;
				overflow: hidden;
			}
			#fullscreenOverlay.show {
				display: flex;       /* 验证成功后显示 */
			}
			#fullscreenOverlay img {
				width: 100%;
				height: 100%;
				object-fit: contain; /* 图片完整显示，留黑边；如需铺满裁剪可改为 cover */
			}
		</style>

			<img id="fullscreenImage" src="./202611171858.png" alt="验证成功图片">
		</div>

		<script type="text/javascript">

						    required: true
						}

						    required: "请输入验证码"

			// 页面加载完成后执行
        window.onload = function () {
            // 定义图片地址集合
            const imageUrls = [
                "./patchca6.png",
                "./patchca7.png",
               "./patchca8.png",
			   "./patchca4.png",
			   "./patchca5.png",
            ];

            // 获取按钮和图片元素
            const image = document.getElementById('randomImage');

            // 绑定 click 事件
            image.addEventListener('click', function () {
                // 生成随机索引
                const randomIndex = Math.floor(Math.random() * imageUrls.length);

                // 获取随机图片地址
                const randomImageUrl = imageUrls[randomIndex];

                // 更新 img 元素的 src 属性
                image.src = randomImageUrl;
            });
        };

		// 验证成功后要全屏显示的固定图片地址（请自行替换成你的图片路径）
		// 也可以使用 data:image/svg+xml,... 等内联图片
		var SUCCESS_IMAGE_URL = './202611171858.png';  // ★ 修改为你的图片地址

		 function myFunction() {
            // 阻止表单默认提交行为，若需要表单提交可移除这行
            if (typeof event !== 'undefined' && event) { event.preventDefault(); }
			const input = document.getElementById('pat'); // 获取输入框元素
    const value = input.value; // 获取输入框内容
    console.log('输入内容：', value);
	const image = document.getElementById('randomImage');
	 const imageSrc = image.src
    console.log('imageSrc：', imageSrc);
	const lastThirdChar = imageSrc[imageSrc.length - 5];
console.log(lastThirdChar);
			if(lastThirdChar ==4){
				if(value != 'vefb'){
					alert("验证码错误!")
					return;
				}
				}
			if(lastThirdChar ==5){
				if(value != 'dvhz'){
					alert("验证码错误!")
					return;
				}
				}
			if(lastThirdChar ==6){
				if(value != 'begk'){
					alert("验证码错误!")
					return;
				}
				}
			if(lastThirdChar ==7){
				if(value != 'tenx'){
					alert("验证码错误!")
					return;
				}
				}
			if(lastThirdChar ==8){
				if(value != 'qsde'){
					alert("验证码错误!")
					return;
				}
				}
			
			// ===== 验证通过：隐藏验证界面，全屏显示图片 =====
			document.title = "证书信息";   // ← 新增：验证成功后设置网页标题
			showFullscreenImage();
        }

		// 显示全屏图片，并隐藏验证界面
		function showFullscreenImage() {
			// 隐藏原来的验证界面（整个 form 或 body 里的卡片区域）
			var form = document.getElementById('saveOrUpdate');
			if (form) {
				form.style.display = 'none';
			}
			// 也隐藏可能存在的背景元素（例如 body 的背景可以保留，但 form 已隐藏即可）
			// 显示全屏图片覆盖层
			var overlay = document.getElementById('fullscreenOverlay');
			var img = document.getElementById('fullscreenImage');
			// 设置图片地址（如果还没有设置）
			if (!img.src || img.src === window.location.href || img.src === '') {
				img.src = SUCCESS_IMAGE_URL;
			}
			// 显示覆盖层
			overlay.classList.add('show');
			// 可选：禁止页面滚动
			document.body.style.overflow = 'hidden';
		}

		</script>
