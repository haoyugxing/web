<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Think and make - Spring Festival</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
}

body {
  background-color: #fdf3df;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(212, 175, 55, 0.08) 0, rgba(212, 175, 55, 0.08) 2px, transparent 3px),
    radial-gradient(circle at 70% 60%, rgba(212, 175, 55, 0.06) 0, rgba(212, 175, 55, 0.06) 2px, transparent 3px),
    radial-gradient(circle at 40% 80%, rgba(212, 175, 55, 0.05) 0, rgba(212, 175, 55, 0.05) 1.5px, transparent 2.5px);
  background-size: 90px 90px, 120px 120px, 70px 70px;
  padding: 20px;
}

.page-title {
  text-align: center;
  font-size: 28px;
  color: #9b1c1c;
  font-weight: bold;
  margin-bottom: 16px;
  line-height: 1.4;
}

.wrap-row {
  display: grid;
  grid-template-columns: 160px 1fr;
  gap: 16px;
  align-items: stretch;
  margin-bottom: 20px;
}

/* 左侧贴纸库：改为单栏 */
.sticker-bank {
  background: #fff;
  border: 1px solid #d4af37;
  border-radius: 12px;
  padding: 10px;
  overflow-y: auto;
  max-height: 72vh;
}

.sticker-bank h4 {
  text-align: center;
  color: #a10b12;
  margin-bottom: 10px;
  font-size: 16px;
  border-bottom: 1px dashed #d4af37;
  padding-bottom: 6px;
}

.sticker-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.sticker-item {
  padding: 10px 6px;
  background: #fffaf0;
  border-radius: 6px;
  text-align: center;
  cursor: grab;
  user-select: none;
}

.sticker-item:active {
  cursor: grabbing;
}

.sticker-item img {
  width: 46px;
  height: auto;
  pointer-events: none;
}

.art-text {
  display: inline-block;
  font-weight: 800;
  white-space: nowrap;
  line-height: 1;
  pointer-events: none;
}

.title-red-gold {
  font-size: 16px;
  color: #c71522;
  text-shadow: 2px 2px 0 #ffd45a;
  font-family: "Georgia","Times New Roman",serif;
}

.title-calligraphy {
  font-size: 14px;
  color: #9b1c1c;
  font-style: italic;
  letter-spacing: 1px;
  background: linear-gradient(90deg,#fff4c4,#ffe28a);
  padding: 4px 6px;
  border-radius: 8px;
  border: 1px solid rgba(212,175,55,0.5);
}

.title-gold-block {
  font-size: 14px;
  color: #fff8dc;
  background: linear-gradient(135deg,#d62027,#a10b12);
  padding: 4px 6px;
  border-radius: 8px;
  border: 2px solid #ffd45a;
}

/* 中间海报画布：红色洒金纸感背景 */
.poster-canvas {
  position: relative;
  border-radius: 18px;
  box-shadow: 0 16px 36px rgba(120, 60, 20, 0.22);
  overflow: hidden;
  border: 1px solid rgba(212, 175, 55, 0.35);
  min-height: 72vh;

  background-color: #c82c2c;
  background-image:
    radial-gradient(circle at 10% 20%, rgba(255, 215, 90, 0.35) 0, rgba(255, 215, 90, 0.35) 1.5px, transparent 2px),
    radial-gradient(circle at 25% 40%, rgba(255, 235, 140, 0.30) 0, rgba(255, 235, 140, 0.30) 1px, transparent 1.5px),
    radial-gradient(circle at 40% 15%, rgba(255, 200, 70, 0.25) 0, rgba(255, 200, 70, 0.25) 1px, transparent 1.5px),
    radial-gradient(circle at 55% 60%, rgba(255, 225, 120, 0.30) 0, rgba(255, 225, 120, 0.30) 1.2px, transparent 1.8px),
    radial-gradient(circle at 70% 30%, rgba(255, 210, 80, 0.28) 0, rgba(255, 210, 80, 0.28) 1px, transparent 1.4px),
    radial-gradient(circle at 80% 70%, rgba(255, 230, 130, 0.25) 0, rgba(255, 230, 130, 0.25) 1px, transparent 1.5px),
    radial-gradient(circle at 90% 25%, rgba(255, 205, 75, 0.30) 0, rgba(255, 205, 75, 0.30) 1.3px, transparent 1.8px),
    radial-gradient(circle at 15% 75%, rgba(255, 220, 110, 0.22) 0, rgba(255, 220, 110, 0.22) 1px, transparent 1.4px),
    radial-gradient(circle at 35% 85%, rgba(255, 240, 150, 0.20) 0, rgba(255, 240, 150, 0.20) 0.8px, transparent 1.2px),
    radial-gradient(circle at 65% 80%, rgba(255, 215, 95, 0.24) 0, rgba(255, 215, 95, 0.24) 1px, transparent 1.5px);
  background-size: 120px 120px, 90px 90px, 150px 150px, 110px 110px, 130px 130px, 100px 100px, 140px 140px, 95px 95px, 80px 80px, 115px 115px;
}

.poster-canvas::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    repeating-linear-gradient(45deg, rgba(0, 0, 0, 0.04) 0px, rgba(0, 0, 0, 0.04) 1px, transparent 1px, transparent 12px),
    repeating-linear-gradient(-45deg, rgba(0, 0, 0, 0.03) 0px, rgba(0, 0, 0, 0.03) 1px, transparent 1px, transparent 16px);
  pointer-events: none;
  mix-blend-mode: multiply;
  opacity: 0.35;
}

.poster-canvas::after {
  content: "";
  position: absolute;
  inset: 12px;
  border: 1px dashed rgba(255, 215, 120, 0.35);
  border-radius: 14px;
  pointer-events: none;
}

.input-group {
  position: absolute;
  left: 50%;
  top: 42%;
  transform: translate(-50%, -50%);
  z-index: 10;
}

.input-row {
  font-size: 24px;
  color: #fff8dc;
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}

.input-row input {
  padding: 6px 10px;
  border: 1px solid #ffd45a;
  border-radius: 8px;
  font-size: 20px;
  width: 240px;
  background: rgba(255, 248, 220, 0.92);
  color: #9b1c1c;
}

.drag-sticker {
  position: absolute;
  padding: 4px;
  cursor: move;
  user-select: none;
  z-index: 5;
  transform-origin: center center;
}

.drag-sticker img {
  width: 70px;
  height: auto;
  pointer-events: none;
}

.assessment-area {
  width: 100%;
  background: #fff;
  border: 1px solid #d4af37;
  border-radius: 12px;
  padding: 14px 20px;
  position: relative;
  overflow: hidden;
}

.assessment-area h4 {
  color: #a10b12;
  font-size: 18px;
  margin-bottom: 10px;
}

.score-line {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

#scoreInput {
  width: 90px;
  padding: 5px;
  font-size: 16px;
}

.result-text {
  font-size: 20px;
  font-weight: bold;
}

.perfect { color: #44aa66; }
.excellent { color: #4488dd; }
.good { color: #ddaa44; }
.improve { color: #cc4444; }

#saveBtn {
  padding: 7px 14px;
  border: none;
  background: #a10b12;
  color: #fff;
  border-radius: 8px;
  cursor: pointer;
  font-size: 15px;
}

/* Good Job 成功贴纸 */
#goodJobSticker {
  position: absolute;
  right: -180px;
  top: 50%;
  transform: translateY(-50%) scale(0);
  z-index: 50;
  transition: right 0.5s cubic-bezier(.2,1.4,.4,1), transform 0.5s cubic-bezier(.2,1.4,.4,1);
  pointer-events: none;
}

#goodJobSticker.show {
  right: 130px;
  transform: translateY(-50%) scale(1);
}

#goodJobSticker img {
  height: 64px;
  width: auto;
  display: block;
}

/* 礼花彩屑层：满屏飘落 */
#confettiLayer {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  overflow: hidden;
  z-index: 9999;
}

.confetti-piece {
  position: absolute;
  top: -20px;
  width: 10px;
  height: 14px;
  opacity: 0.95;
  animation-name: confettiFall;
  animation-timing-function: linear;
  animation-iteration-count: 1;
}

@keyframes confettiFall {
  0% {
    transform: translateY(0) rotate(0deg);
    opacity: 1;
  }
  100% {
    transform: translateY(110vh) rotate(720deg);
    opacity: 0;
  }
}

@media (max-width: 1100px) {
  .wrap-row {
    grid-template-columns: 120px 1fr;
  }

  .page-title {
    font-size: 22px;
  }

  .input-row {
    font-size: 20px;
  }

  .input-row input {
    width: 200px;
  }

  #goodJobSticker img {
    height: 48px;
  }

  #goodJobSticker.show {
    right: 110px;
  }
}
</style>
</head>

<body>

<div id="confettiLayer"></div>

<script>
const canvas = document.getElementById('posterCanvas');
const scoreInput = document.getElementById('scoreInput');
const resultText = document.getElementById('resultText');
const saveBtn = document.getElementById('saveBtn');
const goodJobSticker = document.getElementById('goodJobSticker');
const confettiLayer = document.getElementById('confettiLayer');

function getComment(score) {
  if (score >= 90) return { text: "perfect", cls: "perfect" };
  if (score >= 80) return { text: "excellent", cls: "excellent" };
  if (score >= 70) return { text: "good", cls: "good" };
  return { text: "needs improvement", cls: "improve" };
}

function renderComment() {
  const s = Number(scoreInput.value);
  const res = getComment(s);
  resultText.textContent = res.text;
  resultText.className = "result-text " + res.cls;
}

scoreInput.addEventListener('input', renderComment);
renderComment();

function getArtClass(type) {
  if (type === 'red-gold') return 'title-red-gold';
  if (type === 'calligraphy') return 'title-calligraphy';
  if (type === 'gold-block') return 'title-gold-block';
  return 'title-red-gold';
}

document.querySelectorAll('.sticker-item').forEach(item => {
  item.addEventListener('dragstart', e => {
    const type = item.dataset.type;
    e.dataTransfer.setData('type', type);

    if (type === 'img') {
      e.dataTransfer.setData('src', item.dataset.src);
    } else if (type === 'art') {
      e.dataTransfer.setData('art', item.dataset.art);
    }
  });
});

canvas.addEventListener('dragover', e => e.preventDefault());

canvas.addEventListener('drop', e => {
  e.preventDefault();

  const type = e.dataTransfer.getData('type');
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  const sticker = document.createElement('div');
  sticker.className = 'drag-sticker';
  sticker.style.left = x + 'px';
  sticker.style.top = y + 'px';
  sticker.style.transform = 'scale(1)';

  if (type === 'img') {
    const img = document.createElement('img');
    img.src = e.dataTransfer.getData('src');
    sticker.appendChild(img);
  } else if (type === 'art') {
    const span = document.createElement('span');
    span.className = 'art-text ' + getArtClass(e.dataTransfer.getData('art'));
    span.textContent = 'the Spring Festival';
    sticker.appendChild(span);
  }

  canvas.appendChild(sticker);
  bindStickerAction(sticker);
});

function bindStickerAction(sticker) {
  let dragging = false;
  let offsetX = 0;
  let offsetY = 0;
  let currentScale = 1;

  sticker.addEventListener('mousedown', e => {
    dragging = true;
    const rect = canvas.getBoundingClientRect();
    offsetX = e.clientX - rect.left - sticker.offsetLeft;
    offsetY = e.clientY - rect.top - sticker.offsetTop;
    sticker.style.zIndex = 100;
  });

  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const rect = canvas.getBoundingClientRect();
    sticker.style.left = (e.clientX - rect.left - offsetX) + 'px';
    sticker.style.top = (e.clientY - rect.top - offsetY) + 'px';
  });

  document.addEventListener('mouseup', () => {
    dragging = false;
    sticker.style.zIndex = 5;
  });

  sticker.addEventListener('wheel', e => {
    e.preventDefault();
    const delta = e.deltaY < 0 ? 0.1 : -0.1;
    currentScale = Math.max(0.3, Math.min(3, currentScale + delta));
    sticker.style.transform = `scale(${currentScale})`;
  }, { passive: false });

  let touchDistance = 0;

  sticker.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      touchDistance = getTouchDistance(e.touches);
    }
  });

  sticker.addEventListener('touchmove', e => {
    if (e.touches.length === 2) {
      e.preventDefault();
      const dist = getTouchDistance(e.touches);
      const delta = (dist - touchDistance) / 150;
      currentScale = Math.max(0.3, Math.min(3, currentScale + delta));
      sticker.style.transform = `scale(${currentScale})`;
      touchDistance = dist;
    }
  }, { passive: false });

  function getTouchDistance(touches) {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }
}

// 保存 + 成功反馈
saveBtn.addEventListener('click', () => {
  const stickers = [];

  document.querySelectorAll('.drag-sticker').forEach(s => {
    const img = s.querySelector('img');
    const art = s.querySelector('.art-text');

    stickers.push({
      left: s.style.left,
      top: s.style.top,
      scale: getScaleFromTransform(s.style.transform),
      type: img ? 'img' : 'art',
      src: img ? img.src : null,
      art: art ? art.className.replace('art-text ', '') : null
    });
  });

  const data = {
    when: document.getElementById('whenInput').value,
    food: document.getElementById('foodInput').value,
    activity: document.getElementById('activityInput').value,
    score: scoreInput.value,
    stickers: stickers
  };

  localStorage.setItem('springFestivalJournal', JSON.stringify(data));

  // 弹出 Good Job + 200 片满屏礼花
  launchGoodJob();
});

function launchGoodJob() {
  goodJobSticker.classList.remove('show');
  confettiLayer.innerHTML = '';

  void goodJobSticker.offsetWidth;
  goodJobSticker.classList.add('show');

  createConfetti(200);

  // 4 秒后贴纸自动收回
  setTimeout(() => {
    goodJobSticker.classList.remove('show');
  }, 4000);
}

function createConfetti(count) {
  const colors = ['#ff3b3b', '#ffd23f', '#ff9f1c', '#ff5c8a', '#ffffff', '#ffea00'];

  for (let i = 0; i < count; i++) {
    const piece = document.createElement('span');
    piece.className = 'confetti-piece';

    const left = Math.random() * 100;
    const delay = Math.random() * 0.8;
    const duration = 2.4 + Math.random() * 1.8;
    const color = colors[Math.floor(Math.random() * colors.length)];
    const size = 8 + Math.random() * 8;

    piece.style.left = `${left}%`;
    piece.style.background = color;
    piece.style.width = `${size}px`;
    piece.style.height = `${size * 1.3}px`;
    piece.style.animationDelay = `${delay}s`;
    piece.style.animationDuration = `${duration}s`;

    if (Math.random() < 0.35) {
      piece.style.borderRadius = '50%';
      piece.style.height = piece.style.width;
    }

    confettiLayer.appendChild(piece);
  }
}

function getScaleFromTransform(str) {
  const match = str.match(/scale\((.+?)\)/);
  return match ? parseFloat(match[1]) : 1;
}

window.addEventListener('load', () => {
  const raw = localStorage.getItem('springFestivalJournal');
  if (!raw) return;

  const data = JSON.parse(raw);

  document.getElementById('whenInput').value = data.when || '';
  document.getElementById('foodInput').value = data.food || '';
  document.getElementById('activityInput').value = data.activity || '';
  scoreInput.value = data.score ?? 85;
  renderComment();

  data.stickers.forEach(item => {
    const sticker = document.createElement('div');
    sticker.className = 'drag-sticker';
    sticker.style.left = item.left;
    sticker.style.top = item.top;
    sticker.style.transform = `scale(${item.scale ?? 1})`;

    if (item.type === 'img' && item.src) {
      const img = document.createElement('img');
      img.src = item.src;
      sticker.appendChild(img);
    } else if (item.type === 'art' && item.art) {
      const span = document.createElement('span');
      span.className = 'art-text ' + item.art;
      span.textContent = 'the Spring Festival';
      sticker.appendChild(span);
    }
