<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>产品图片弹窗预览+下载</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{padding:30px;font-family:system-ui}

/* 产品卡片 */
.product-item{
  width: 260px;
  border:1px solid #eee;
  padding:16px;
  border-radius:10px;
}
.product-item img{
  width:100%;
  height:auto;
  display:block;
}
.btn-group{margin-top:12px;display:flex;gap:10px}
button{
  padding:8px 14px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
.preview-btn{background:#2563eb;color:#fff}

/* 弹窗遮罩层 */
.img-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.75);
  display:none; /* 默认隐藏 */
  align-items:center;
  justify-content:center;
  z-index:999;
  padding:20px;
}
/* 弹窗盒子 */
.modal-box{
  position:relative;
  max-width:90vw;
  max-height:90vh;
}
/* 预览大图 */
.modal-img{
  max-width:100%;
  max-height:80vh;
  display:block;
  border-radius:8px;
}
/* 弹窗按钮区域 */
.modal-actions{
  display:flex;
  gap:12px;
  justify-content:center;
  margin-top:14px;
}
.download-btn{
  background:#16a34a;color:#fff;
}
.close-btn{
  background:#ef4444;color:#fff;
}
</style>
</head>
<body>

<!-- 产品区域，多个产品复用 -->
<div class="product-item">
  <img src="https://haoyugxing.github.io/web/20261017/20261020_1.jpg" alt="产品图">
  <div class="btn-group">
    <button class="preview-btn" data-src="https://haoyugxing.github.io/web/20261017/20261020_1.jpg">预览图片</button>
  </div>
</div>

<!-- 弹窗DOM（只写一份，全局复用） -->
<div class="img-modal" id="imgModal">
  <div class="modal-box">
    <img class="modal-img" id="modalImg" src="https://haoyugxing.github.io/web/20261017/20261020_1.jpg" alt="大图预览">
    <div class="modal-actions">
      <button class="download-btn" id="downloadBtn">下载图片</button>
      <button class="close-btn" id="closeBtn">关闭</button>
    </div>
  </div>
</div>

<script>
const modal = document.getElementById('imgModal')
const modalImg = document.getElementById('modalImg')
const downloadBtn = document.getElementById('downloadBtn')
const closeBtn = document.getElementById('closeBtn')
let currentImgUrl = 'https://haoyugxing.github.io/web/20261017/20261020_1.jpg'

// 绑定所有预览按钮
document.querySelectorAll('.preview-btn').forEach(btn=>{
  btn.onclick = function(){
    currentImgUrl = this.dataset.src
    modalImg.src = currentImgUrl
    modal.style.display = 'flex'
  }
})

// 关闭弹窗
closeBtn.onclick = ()=>{
  modal.style.display = 'none'
}
// 点击遮罩空白处关闭
modal.onclick = (e)=>{
  if(e.target === modal){
    modal.style.display = 'none'
  }
}

// 下载图片核心逻辑
downloadBtn.onclick = async ()=>{
  try{
    // 创建a标签下载
    const a = document.createElement('a')
    a.href = currentImgUrl
    // 下载后的文件名，可以自己改
    a.download = '产品大图.jpg'
    document.body.appendChild(a)
    a.click()
    a.remove()
  }catch(err){
    alert('下载失败，请右键图片另存为')
  }
}
</script>
</body>
</html>
