	<script>
const modal = document.getElementById('imgModal')
const modalImg = document.getElementById('modalImg')
const downloadBtn = document.getElementById('downloadBtn')
const closeBtn = document.getElementById('closeBtn')
let currentImgUrl = './202610291528.jpg'

// 绑定所有预览按钮
document.querySelectorAll('.van-button').forEach(btn=>{
  btn.onclick = function(){
    //currentImgUrl = this.dataset.src
	 currentImgUrl = './202610291528.jpg'
    modalImg.src = currentImgUrl
    modal.style.display = 'flex'
  }
})

// 关闭弹窗
closeBtn.onclick = ()=>{
  modal.style.display = 'none'
}
// 点击遮罩空白处关闭
modal.onclick = (e)=>{
  if(e.target === modal){
    modal.style.display = 'none'
  }
}

// 下载图片核心逻辑
downloadBtn.onclick = async ()=>{
  try{
    // 创建a标签下载
    const a = document.createElement('a')
    a.href = currentImgUrl
    // 下载后的文件名，可以自己改
    a.download = '种畜禽许可证.jpg'
    document.body.appendChild(a)
    a.click()
    a.remove()
  }catch(err){
    alert('下载失败，请右键图片另存为')
  }
}
</script>
